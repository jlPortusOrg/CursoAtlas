<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
<style>text{font-family:Arial,sans-serif;fill:#f8f8f2}.t{font-size:28px;font-weight:700}.s{font-size:20px;fill:#aeb6c8}.box{fill:#20232f;stroke:#8be9fd;stroke-width:2}.feat{fill:#1f2d29;stroke:#50fa7b;stroke-width:2}.atlas{fill:#24202f;stroke:#bd93f9;stroke-width:2}.a{stroke:#6272a4;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6272a4"/></marker></defs>
<text x="700" y="48" text-anchor="middle" class="t">Aplicación consumidora ATLAS</text>
<rect x="60" y="100" rx="20" width="1280" height="160" class="feat"/><text x="700" y="145" text-anchor="middle" class="t">Features de negocio</text><text x="700" y="188" text-anchor="middle" class="s">casos de uso · reglas funcionales · composición de pantallas · decisiones de dominio</text><text x="700" y="225" text-anchor="middle" class="s">la aplicación es owner de esta capa</text>
<rect x="70" y="340" rx="20" width="580" height="220" class="atlas"/><text x="360" y="390" text-anchor="middle" class="t">Frontend ATLAS</text><text x="360" y="435" text-anchor="middle" class="s">ModelBase + metadata</text><text x="360" y="472" text-anchor="middle" class="s">View / Grid / Forms / Components</text><text x="360" y="509" text-anchor="middle" class="s">ownership scoped + configuración</text>
<rect x="750" y="340" rx="20" width="580" height="220" class="box"/><text x="1040" y="390" text-anchor="middle" class="t">Backend ATLAS</text><text x="1040" y="435" text-anchor="middle" class="s">repositorios + Data REST</text><text x="1040" y="472" text-anchor="middle" class="s">seguridad + lifecycle</text><text x="1040" y="509" text-anchor="middle" class="s">persistencia y contratos HTTP</text>
<path d="M360 262 V332" class="a"/><path d="M1040 262 V332" class="a"/><path d="M652 450 H742" class="a"/></svg>