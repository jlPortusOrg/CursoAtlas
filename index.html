<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, minimum-scale=0.5, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes"
    />

    <title>Curso ATLAS 3</title>

    <link rel="stylesheet" href="dist/reset.css" />
    <link rel="stylesheet" href="dist/reveal.css" />
    <link rel="stylesheet" href="dist/theme/dracula.css" />
    <link rel="stylesheet" href="css/atlas-course.css" />

    <link rel="stylesheet" href="plugin/highlight/dracula.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides"></div>
    </div>

    <script src="dist/reveal.js"></script>
    <script src="plugin/notes/notes.js"></script>
    <script src="plugin/markdown/markdown.js"></script>
    <script src="plugin/highlight/highlight.js"></script>
    <script src="scripts/md-utils.js"></script>
    <script src="scripts/markdown-navigation-loader.js"></script>
    <script>
      Reveal.initialize({
        hash: false,
        width: 1520,
        height: 1000,
        margin: 0.03,
        minScale: 0.5,
        maxScale: 3.0,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
      }).then(() => {
        if (window.MarkdownNavigationLoader) {
          window.MarkdownNavigationLoader.init({ initialMd: 'README.md' });
        }
      });
    </script>
  </body>
</html>
